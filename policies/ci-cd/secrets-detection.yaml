# Policy: Secrets Detection and Prevention
# Framework Mapping: SOC2 CC6.1, CC6.6, HIPAA 164.312(a)(1), ISO 27001 A.9.4.1
# Severity: CRITICAL
# Description: Prevents secrets and credentials from being committed to repositories

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-detection-policy
  namespace: ci-cd
data:
  policy.yaml: |
    # Secrets Detection Policy Configuration
    name: "Secrets Detection and Prevention"
    version: "1.0.0"
    frameworks:
      - "SOC2 CC6.1 - Logical and Physical Access Controls"
      - "SOC2 CC6.6 - Encryption of Data at Rest"
      - "HIPAA 164.312(a)(1) - Access Control"
      - "ISO 27001 A.9.4.1 - Information Access Restriction"

    severity: CRITICAL
    enforcement: BLOCK_ON_VIOLATION

    # Tools to run for secrets detection
    scanners:
      - name: detect-secrets
        enabled: true
        config: .detect-secrets.conf
        fail_on_finding: true

      - name: trufflehog
        enabled: true
        config: trufflehog.yaml
        fail_on_finding: true
        entropy_threshold: 4.5

      - name: gitleaks
        enabled: true
        config: gitleaks.toml
        fail_on_finding: true

    # Exemptions and allowlists
    exemptions:
      files:
        - "**/*.md"  # Documentation files (review manually)
        - "**/test/**/*.example"  # Example files
        - "**/*.sample"  # Sample configuration files

      patterns:
        - "EXAMPLE_KEY"
        - "YOUR_KEY_HERE"
        - "REPLACE_ME"

    # Required actions on policy violation
    violation_actions:
      - BLOCK_BUILD
      - NOTIFY_SECURITY_TEAM
      - CREATE_INCIDENT_TICKET
      - REQUIRE_KEY_ROTATION

    # Notification settings
    notifications:
      slack:
        channel: "#security-alerts"
        severity: CRITICAL

      email:
        recipients:
          - "security-team@company.com"
          - "ciso@company.com"

      pagerduty:
        service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity: high

  detect-secrets.conf: |
    {
      "version": "1.4.0",
      "plugins_used": [
        {
          "name": "ArtifactoryDetector"
        },
        {
          "name": "AWSKeyDetector"
        },
        {
          "name": "AzureStorageKeyDetector"
        },
        {
          "name": "Base64HighEntropyString",
          "limit": 4.5
        },
        {
          "name": "BasicAuthDetector"
        },
        {
          "name": "CloudantDetector"
        },
        {
          "name": "DiscordBotTokenDetector"
        },
        {
          "name": "GitHubTokenDetector"
        },
        {
          "name": "HexHighEntropyString",
          "limit": 3.0
        },
        {
          "name": "IbmCloudIamDetector"
        },
        {
          "name": "IbmCosHmacDetector"
        },
        {
          "name": "JwtTokenDetector"
        },
        {
          "name": "KeywordDetector",
          "keyword_exclude": ""
        },
        {
          "name": "MailchimpDetector"
        },
        {
          "name": "NpmDetector"
        },
        {
          "name": "PrivateKeyDetector"
        },
        {
          "name": "SendGridDetector"
        },
        {
          "name": "SlackDetector"
        },
        {
          "name": "SoftlayerDetector"
        },
        {
          "name": "SquareOAuthDetector"
        },
        {
          "name": "StripeDetector"
        },
        {
          "name": "TwilioKeyDetector"
        }
      ],
      "filters_used": [
        {
          "path": "detect_secrets.filters.allowlist.is_line_allowlisted"
        },
        {
          "path": "detect_secrets.filters.common.is_ignored_due_to_verification_policies",
          "min_level": 2
        },
        {
          "path": "detect_secrets.filters.heuristic.is_indirect_reference"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_likely_id_string"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_lock_file"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_not_alphanumeric_string"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_potential_uuid"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_prefixed_with_dollar_sign"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_sequential_string"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_swagger_file"
        },
        {
          "path": "detect_secrets.filters.heuristic.is_templated_secret"
        }
      ],
      "results": {}
    }

  remediation-runbook.md: |
    # Secrets Detection Policy - Remediation Runbook

    ## 🚨 CRITICAL: Secrets Detected in Repository

    ### Immediate Actions (within 1 hour)

    1. **STOP the deployment pipeline immediately**
       - Do not proceed with build or deployment
       - Pipeline should be automatically blocked by policy gate

    2. **Assess the exposure**
       - Determine which secrets were exposed
       - Check if the branch has been pushed to remote
       - Review who has access to the repository
       - Check if the commit is in the git history

    3. **Rotate credentials IMMEDIATELY**
       - AWS Keys: Use AWS Console or CLI to deactivate and create new keys
       - API Keys: Revoke in the service provider's console
       - Database passwords: Update in secret manager and rotate
       - SSH Keys: Remove from authorized_keys, generate new keypair
       - Certificates: Revoke and reissue

    ### Secret Removal Process

    **Option 1: Pre-commit (Secret not yet committed)**
    ```bash
    # Remove the secret from the file
    # Use environment variables or secret manager instead

    # Stage the corrected file
    git add <file>

    # Commit the fix
    git commit -m "Remove hardcoded credentials, use env vars"
    ```

    **Option 2: Secret committed but not pushed**
    ```bash
    # Amend the last commit
    git add <corrected-file>
    git commit --amend --no-edit

    # Or reset to previous commit
    git reset --soft HEAD~1
    # Make corrections
    git add .
    git commit -m "Fix: Remove secrets, use secret manager"
    ```

    **Option 3: Secret pushed to remote repository**
    ```bash
    # Use BFG Repo-Cleaner or git-filter-repo
    # This rewrites history - requires force push

    # Install BFG
    brew install bfg

    # Clone a fresh copy
    git clone --mirror https://github.com/org/repo.git

    # Remove secrets from history
    bfg --replace-text passwords.txt repo.git

    # Clean up
    cd repo.git
    git reflog expire --expire=now --all
    git gc --prune=now --aggressive

    # Force push (coordinate with team!)
    git push --force
    ```

    ### Proper Secret Management

    **Use Environment Variables:**
    ```bash
    # .env file (add to .gitignore!)
    DATABASE_URL=postgresql://user:pass@localhost/db
    API_KEY=sk_live_abc123...
    AWS_ACCESS_KEY_ID=AKIA...
    ```

    **Use Secret Management Services:**
    - **AWS Secrets Manager**: Store and rotate credentials
    - **HashiCorp Vault**: Enterprise secret management
    - **Azure Key Vault**: Centralized secret storage
    - **GitHub Secrets**: For CI/CD workflows

    **Example - Loading from Secret Manager:**
    ```python
    import boto3
    from botocore.exceptions import ClientError

    def get_secret(secret_name):
        session = boto3.session.Session()
        client = session.client(
            service_name='secretsmanager',
            region_name='us-east-1'
        )
        try:
            response = client.get_secret_value(SecretId=secret_name)
            return response['SecretString']
        except ClientError as e:
            raise e

    # Use it
    db_password = get_secret('prod/database/password')
    ```

    ### Prevention - Pre-commit Hooks

    **Install detect-secrets pre-commit hook:**
    ```bash
    # Install pre-commit
    pip install pre-commit detect-secrets

    # Create .pre-commit-config.yaml
    cat > .pre-commit-config.yaml << EOF
    repos:
    - repo: https://github.com/Yelp/detect-secrets
      rev: v1.4.0
      hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json
    EOF

    # Initialize baseline
    detect-secrets scan > .secrets.baseline

    # Install the hooks
    pre-commit install
    ```

    ### Compliance Requirements

    | Framework | Control | Requirement |
    |-----------|---------|-------------|
    | SOC2 CC6.1 | Logical Access | Secrets must be stored in secure vaults, not code |
    | SOC2 CC6.6 | Encryption | Credentials must be encrypted at rest |
    | HIPAA 164.312(a)(1) | Access Control | Unique user identification and emergency access |
    | ISO 27001 A.9.4.1 | Access Restriction | Information access restrictions must be enforced |

    ### Incident Response

    1. **Create Security Incident Ticket**
       - Jira Project: SEC
       - Priority: P1 (Critical)
       - Template: "Secrets Exposure Incident"

    2. **Notify Required Parties**
       - Security Team: security@company.com
       - CISO: ciso@company.com
       - Compliance: compliance@company.com
       - Legal (if customer data affected): legal@company.com

    3. **Document the Incident**
       - What secrets were exposed
       - How long were they exposed
       - Who had access
       - What actions were taken
       - Timeline of events

    4. **Post-Incident Review**
       - Root cause analysis
       - Process improvements
       - Training needs
       - Policy updates

    ### Contact Information

    - **Security Team**: #security-team (Slack), security@company.com
    - **On-Call Security Engineer**: Page via PagerDuty
    - **CISO**: ciso@company.com
    - **Incident Response**: incidents@company.com

